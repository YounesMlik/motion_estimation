[project]
name = "motion-estimation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Younes Mlik", email = "younesmlik88@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mediapy>=1.2.7",
    "numpy>=2.5.4",
    "opencv-contrib-python>=5.0.0.93",
    "pillow>=13.0.0",
    "seaborn>=0.13.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
motion-estimation = "motion_estimation:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
